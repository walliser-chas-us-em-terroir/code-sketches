<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sketch 2 — Damier parfait — Mathias Udriot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link rel="stylesheet" href="../style.css" />
</head>
<body class="sketch-page">

<!-- ── MAIN ── -->
<main>
  <h3>Damier parfait</h3>
  <div class="sketch-layout">
    <div class="sketch-canvas-wrap" id="canvas-container"></div>
    <div class="sketch-description">
      <p>
        Un damier noir et blanc statique composé de 64 cases de 50×50 pixels,
        généré par une double boucle imbriquée.
      </p>
      <p>
        La couleur de chaque case est déterminée par la parité de la somme
        de ses indices : <code>(x + y) / 50 % 2</code>.
      </p>
      <div class="sketch-meta">Sketch 2 &nbsp;·&nbsp; p5.js &nbsp;·&nbsp; 2026</div>
    </div>
  </div>
</main>

<!-- ── P5.JS ── -->
<script>
function setup() {
  let cnv = createCanvas(400, 400);
  cnv.parent('canvas-container');
  noLoop();
}

function draw() {
  for (let y = 0; y < height; y += 50) {
    for (let x = 0; x < width; x += 50) {
      fill((x + y) / 50 % 2 == 0 ? 0 : 255);
      rect(x, y, 50, 50);
    }
  }
}
</script>

</body>
</html>
