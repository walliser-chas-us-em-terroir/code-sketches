<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sketch 4 — Générateur QR — Mathias Udriot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link rel="stylesheet" href="../style.css" />
</head>
<body class="sketch-page">

<!-- ── MAIN ── -->
<main>
  <h3>Générateur QR</h3>
  <div class="sketch-layout">
    <div class="sketch-canvas-wrap" id="canvas-container">
      <button class="btn-regen" onclick="generate()" title="Relancer">↺</button>
    </div>
    <div class="sketch-description">
      <p>
        Une grille de 10×10 cases aux nuances de gris aléatoires,
        générée une seule fois au chargement — comme un QR code abstrait.
      </p>
      <p>
        Les valeurs sont stockées dans un tableau 2D créé avec une fonction
        dédiée <code>make2Darray()</code>, puis dessinées dans <code>setup()</code>.
      </p>
      <div class="sketch-meta">Sketch 4 &nbsp;·&nbsp; p5.js &nbsp;·&nbsp; 2026</div>
    </div>
  </div>
</main>

<!-- ── P5.JS ── -->
<script>
let cols = 10;
let rows = 10;
let colors = [];

function setup() {
  let cnv = createCanvas(300, 300);
  cnv.parent('canvas-container');
  generate();
}

function generate() {
  colors = make2Darray(cols, rows);

  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      colors[i][j] = random(255);
    }
  }

  background(51);

  for (let a = 0; a < cols; a++) {
    for (let b = 0; b < rows; b++) {
      let x = a * 30;
      let y = b * 30;
      fill(colors[a][b]);
      stroke(9);
      rect(x, y, 30, 30);
    }
  }
}

function make2Darray(cols, rows) {
  var arr = new Array(cols);
  for (var i = 0; i < arr.length; i++) {
    arr[i] = new Array(rows);
  }
  return arr;
}

function draw() {}
</script>

</body>
</html>
