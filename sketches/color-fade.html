<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sketch 3 — Dégradé de couleur — Mathias Udriot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link rel="stylesheet" href="../style.css" />
</head>
<body class="sketch-page">

<!-- ── MAIN ── -->
<main>
  <h3>Dégradé de couleur</h3>
  <div class="sketch-layout">
    <div class="sketch-canvas-wrap" id="canvas-container"></div>
    <div class="sketch-description">
      <p>
        Une grille de 8×8 carrés dont la couleur varie selon leur position :
        le rouge suit l'axe X et le bleu suit l'axe Y.
      </p>
      <p>
        Chaque case est remplie avec <code>fill(x*25, 25, y*25)</code>,
        créant un dégradé RGB progressif dans les deux directions.
      </p>
      <div class="sketch-meta">Sketch 3 &nbsp;·&nbsp; p5.js &nbsp;·&nbsp; 2026</div>
    </div>
  </div>
</main>

<!-- ── P5.JS ── -->
<script>
function setup() {
  let cnv = createCanvas(400, 400);
  cnv.parent('canvas-container');
  background(220);

  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      noStroke();
      fill(x * 25, 25, y * 25);
      square(x * 50, y * 50, 50);
    }
  }
}

function draw() {}
</script>

</body>
</html>
